[package]
name = "burnbox-core"
version = "0.1.0"
edition = "2024"
description = "Unprivileged namespace sandbox and RAM-wipe engine for BurnBox"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["sched", "mount", "process", "user", "signal", "fs"] }
serde_json = "1"
zeroize = "1"
